services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d forum"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/entrypoint-initdb.sh:/docker-entrypoint-initdb.d/entrypoint-initdb.sh
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql.template
    networks:
      - forum

  migrator:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://migrator:${MIGRATOR_PASSWORD}@db:5432/forum?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forum

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-postgres}
      - DATABASE_URL=postgres://app_user:${APP_PASSWORD}@db:5432/forum?sslmode=disable
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - forum

volumes:
  db_data:

networks:
  forum:
