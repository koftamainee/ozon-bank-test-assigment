services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d forum"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/entrypoint-initdb.sh:/docker-entrypoint-initdb.d/entrypoint-initdb.sh
      - ./docker/db/init.sql:/scripts/init.sql:ro
    networks:
      - forum

  migrator:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://migrator:${MIGRATOR_PASSWORD}@db:5432/forum?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forum

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=${ENV:-dev}
      - STORAGE_TYPE=${STORAGE_TYPE:-postgres}
      - DATABASE_URL=postgres://app_user:${APP_PASSWORD}@db:5432/forum?sslmode=disable
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_TTL=${JWT_TTL:-24h}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - forum

volumes:
  db_data:

networks:
  forum:
