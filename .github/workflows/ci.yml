name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -race ./...
      - run: go build ./...

  drift:
    name: Drift (generated code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go mod download
      - name: Regenerate sqlc code
        run: make sqlc
      - name: Regenerate gqlgen code
        run: make gqlgen
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "generated code is out of date; run 'make sqlc' and 'make gqlgen' and commit the result"
            git diff
            git status --porcelain
            exit 1
          fi

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    env:
      APP_ADMIN_PASSWORD: ci-admin
      APP_PASSWORD: ci-app
      MIGRATOR_PASSWORD: ci-migrator
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q
      - name: Build app image
        run: docker compose build
